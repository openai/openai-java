org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.parallel=true
org.gradle.daemon=true
# Keep the existing Dokka task graph and generated Javadoc links stable. Migrate to Dokka's V2
# task/aggregation model and K2 analysis as separate documentation-pipeline changes.
org.jetbrains.dokka.experimental.gradle.pluginMode=V1Enabled
org.jetbrains.dokka.experimental.tryK2=false
# Keep both build JVMs bounded, but let HotSpot use full tiered compilation and
# choose its compiler-thread count. In-process tools such as ProGuard benefit
# from full JIT, while the Kotlin compiler runs in its own reusable daemon.
org.gradle.jvmargs=\
  -Xmx8g \
  -XX:+UseParallelGC \
  -XX:ReservedCodeCacheSize=512m \
  -XX:MaxMetaspaceSize=2G
kotlin.daemon.jvmargs=\
  -Xmx8g \
  -XX:+UseParallelGC \
  -XX:ReservedCodeCacheSize=512m \
  -XX:MaxMetaspaceSize=2G
kotlin.compiler.execution.strategy=daemon
