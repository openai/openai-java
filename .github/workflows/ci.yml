name: CI

on:
  push:
    branches:
      - main
      - next
      - 'stl/**'
      - 'codegen/stl/**'
  pull_request:
    branches:
      - main
      - next

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: CI / change classification
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read

    outputs:
      full_ci: ${{ steps.filter.outputs.full_ci }}

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Classify changes
        id: filter
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        with:
          # On push, compare only the commits in this push. Pull requests use the GitHub API
          # to compare the entire PR with its base branch.
          base: ${{ github.ref }}
          predicate-quantifier: every
          filters: .github/ci-path-filters.yml

  lint:
    name: CI / lint
    needs: changes
    if: needs.changes.outputs.full_ci == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5
        with:
          distribution: temurin
          java-version: |
            8
            21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2

      - name: Run lints
        run: ./scripts/lint

  build:
    name: CI / build + Jackson compatibility
    needs: changes
    if: >-
      needs.changes.outputs.full_ci == 'true' &&
      !(github.repository == 'stainless-sdks/openai-java' &&
        github.event_name == 'push' &&
        !startsWith(github.ref, 'refs/heads/stl/'))
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5
        with:
          distribution: temurin
          java-version: |
            8
            21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2

      - name: Build SDK and run compatibility tests
        env:
          GRADLE_OPTS: -Dkotlin.compiler.execution.strategy=in-process
        run: ./scripts/build

  test:
    name: CI / tests
    needs: changes
    if: needs.changes.outputs.full_ci == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5
        with:
          distribution: temurin
          java-version: |
            8
            21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2

      - name: Run tests
        run: ./scripts/test

  api_compatibility:
    name: CI / API compatibility
    needs: changes
    if: needs.changes.outputs.full_ci == 'true' && github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5
        with:
          distribution: temurin
          java-version: |
            8
            21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2

      - name: Compile previous tests against the proposed SDK
        env:
          BASE_COMMIT: ${{ github.event.pull_request.base.sha }}
          GRADLE_OPTS: -Dkotlin.compiler.execution.strategy=in-process
        run: |
          set -euo pipefail

          # The proposed detector verifies the current compatibility policy. Running the baseline
          # detector as well prevents a PR from weakening that policy to hide an SDK break.
          ./scripts/detect-breaking-changes "$BASE_COMMIT"

          BASE_DETECTOR="$(mktemp ./scripts/detect-breaking-changes.baseline.XXXXXX)"
          trap 'rm -f "$BASE_DETECTOR"' EXIT
          git show "${BASE_COMMIT}:scripts/detect-breaking-changes" > "$BASE_DETECTOR"
          chmod +x "$BASE_DETECTOR"
          "$BASE_DETECTOR" "$BASE_COMMIT"

  version_support_matrix:
    name: CI / version support matrix
    needs: changes
    if: needs.changes.outputs.full_ci == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    outputs:
      runtime-matrix: ${{ steps.matrix.outputs.runtime-matrix }}

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2

      - name: Read version support policy
        id: matrix
        run: |
          ./scripts/gradle generateVersionSupportMatrix -PversionSupportMatrix=pull-request
          echo "runtime-matrix=$(< build/version-support-matrix.json)" >> "$GITHUB_OUTPUT"

  runtime_compatibility:
    name: CI / runtime compatibility / Java ${{ matrix.java }}
    needs:
      - changes
      - version_support_matrix
    if: needs.changes.outputs.full_ci == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        java: ${{ fromJSON(needs.version_support_matrix.outputs.runtime-matrix) }}

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Set up consumer Java
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: Set up build Java
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2

      - name: Run consumer compatibility smoke test
        run: >-
          ./scripts/gradle
          :openai-java-runtime-compatibility:runRuntimeCompatibility
          -PruntimeJavaVersion=${{ matrix.java }}

  required:
    name: CI / required
    if: always()
    needs:
      - changes
      - lint
      - build
      - test
      - api_compatibility
      - version_support_matrix
      - runtime_compatibility
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Verify required jobs succeeded
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          FULL_CI: ${{ needs.changes.outputs.full_ci }}
          EVENT_NAME: ${{ github.event_name }}
          REPOSITORY: ${{ github.repository }}
          REF: ${{ github.ref }}
          LINT_RESULT: ${{ needs.lint.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          TEST_RESULT: ${{ needs.test.result }}
          API_COMPATIBILITY_RESULT: ${{ needs.api_compatibility.result }}
          VERSION_SUPPORT_MATRIX_RESULT: ${{ needs.version_support_matrix.result }}
          RUNTIME_COMPATIBILITY_RESULT: ${{ needs.runtime_compatibility.result }}
        run: |
          set -euo pipefail

          failed_jobs=()
          expect_result() {
            local job="$1"
            local actual="$2"
            local expected="$3"
            if [[ "$actual" != "$expected" ]]; then
              failed_jobs+=("$job: expected $expected, got $actual")
            fi
          }

          expect_result "change classification" "$CHANGES_RESULT" "success"

          case "$FULL_CI" in
            true)
              expected_lint="success"
              expected_build="success"
              expected_test="success"
              expected_api_compatibility="skipped"
              expected_version_support_matrix="success"
              expected_runtime_compatibility="success"

              if [[ "$EVENT_NAME" == "pull_request" ]]; then
                expected_api_compatibility="success"
              fi

              if [[ "$EVENT_NAME" == "push" &&
                    "$REPOSITORY" == "stainless-sdks/openai-java" &&
                    "$REF" != refs/heads/stl/* ]]; then
                expected_build="skipped"
              fi
              ;;
            false)
              expected_lint="skipped"
              expected_build="skipped"
              expected_test="skipped"
              expected_api_compatibility="skipped"
              expected_version_support_matrix="skipped"
              expected_runtime_compatibility="skipped"
              ;;
            *)
              failed_jobs+=("change classification: invalid full_ci output '$FULL_CI'")
              ;;
          esac

          if [[ "$FULL_CI" == "true" || "$FULL_CI" == "false" ]]; then
            expect_result "lint" "$LINT_RESULT" "$expected_lint"
            expect_result "build" "$BUILD_RESULT" "$expected_build"
            expect_result "test" "$TEST_RESULT" "$expected_test"
            expect_result \
              "API compatibility" "$API_COMPATIBILITY_RESULT" "$expected_api_compatibility"
            expect_result \
              "version support matrix" \
              "$VERSION_SUPPORT_MATRIX_RESULT" \
              "$expected_version_support_matrix"
            expect_result \
              "runtime compatibility" \
              "$RUNTIME_COMPATIBILITY_RESULT" \
              "$expected_runtime_compatibility"
          fi

          if (( ${#failed_jobs[@]} > 0 )); then
            printf 'Required CI job did not succeed: %s\n' "${failed_jobs[@]}"
            exit 1
          fi

          echo "All required CI jobs succeeded or were safely skipped."
