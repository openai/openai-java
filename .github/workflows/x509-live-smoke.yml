name: X.509 live verification

on:
  workflow_dispatch:
    inputs:
      run_x509:
        description: Confirm the protected issuer-to-mTLS API verification
        required: true
        default: false
        type: boolean

permissions: {}

concurrency:
  group: x509-live-verification
  cancel-in-progress: false

jobs:
  preflight:
    name: X.509 live gate status
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Record that live verification was not requested
        if: ${{ !inputs.run_x509 }}
        shell: bash
        run: |
          echo '## X.509 live verification: NOT RUN' >> "$GITHUB_STEP_SUMMARY"
          echo 'The manual X.509 verification input was not enabled.' >> "$GITHUB_STEP_SUMMARY"

      - name: Reject noncanonical live verification requests
        if: >-
          inputs.run_x509 &&
          (github.repository != 'openai/openai-java' || github.ref != 'refs/heads/main')
        shell: bash
        run: |
          echo 'X.509 live verification is restricted to openai/openai-java main.' >&2
          exit 1

      - name: Record the pending protected verification
        if: >-
          inputs.run_x509 &&
          github.repository == 'openai/openai-java' &&
          github.ref == 'refs/heads/main'
        shell: bash
        run: |
          echo '## X.509 live verification: REQUESTED' >> "$GITHUB_STEP_SUMMARY"
          echo 'Production verification is pending protected-environment approval and execution.' >> "$GITHUB_STEP_SUMMARY"

  live:
    name: Issuer exchange and mTLS API
    needs: preflight
    if: >-
      inputs.run_x509 &&
      github.repository == 'openai/openai-java' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # This environment must require independent SDK-team approval with self-review and
    # administrator bypass disabled. See docs/x509-live-verification.md.
    environment: x509-live-smoke
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 21

      - name: Create isolated X.509 Gradle User Home
        env:
          TRUSTED_GRADLE_USER_HOME: ${{ runner.temp }}/trusted-x509-gradle-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail

          if [[ -e "$TRUSTED_GRADLE_USER_HOME" || -L "$TRUSTED_GRADLE_USER_HOME" ]]; then
            echo "::error::X.509 Gradle User Home already exists"
            exit 1
          fi

          mkdir -m 700 "$TRUSTED_GRADLE_USER_HOME"
          printf 'GRADLE_USER_HOME=%s\n' "$TRUSTED_GRADLE_USER_HOME" >> "$GITHUB_ENV"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-disabled: true

      - name: Verify enrolled X.509 identity
        shell: bash
        env:
          OPENAI_X509_LIVE_TEST: "1"
          OPENAI_X509_KEYSTORE_P12_BASE64: ${{ secrets.OPENAI_X509_KEYSTORE_P12_BASE64 }}
          OPENAI_X509_KEYSTORE_PASSWORD: ${{ secrets.OPENAI_X509_KEYSTORE_PASSWORD }}
          OPENAI_X509_CERTIFICATE_ALIAS: ${{ secrets.OPENAI_X509_CERTIFICATE_ALIAS }}
          OPENAI_X509_IDENTITY_PROVIDER_ID: ${{ secrets.OPENAI_X509_IDENTITY_PROVIDER_ID }}
          OPENAI_X509_SERVICE_ACCOUNT_ID: ${{ secrets.OPENAI_X509_SERVICE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          missing_configuration=false
          for name in \
            OPENAI_X509_KEYSTORE_P12_BASE64 \
            OPENAI_X509_KEYSTORE_PASSWORD \
            OPENAI_X509_CERTIFICATE_ALIAS \
            OPENAI_X509_IDENTITY_PROVIDER_ID \
            OPENAI_X509_SERVICE_ACCOUNT_ID; do
            if [[ -z "${!name:-}" ]]; then
              missing_configuration=true
            fi
          done

          if [[ "$missing_configuration" == true ]]; then
            echo '## X.509 live verification: NOT RUN' >> "$GITHUB_STEP_SUMMARY"
            echo 'Required protected-environment configuration was unavailable.' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          ./gradlew :openai-java-client-okhttp:test \
            --tests '*X509LiveVerificationTest' \
            --no-build-cache \
            --no-daemon \
            --rerun-tasks

          report='openai-java-client-okhttp/build/test-results/test/TEST-com.openai.client.okhttp.X509LiveVerificationTest.xml'
          test -f "$report"
          grep -q 'tests="1"' "$report"
          grep -q 'skipped="0"' "$report"
          timestamp=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          runtime=$(java -version 2>&1)
          runtime=${runtime%%$'\n'*}
          echo '## X.509 live verification: PASSED' >> "$GITHUB_STEP_SUMMARY"
          echo 'The enrolled issuer exchange and approved mTLS API request both completed.' >> "$GITHUB_STEP_SUMMARY"
          printf -- '- Timestamp: `%s`\n- Revision: `%s`\n- Runtime: `%s`\n' \
            "$timestamp" "$GITHUB_SHA" "$runtime" >> "$GITHUB_STEP_SUMMARY"
