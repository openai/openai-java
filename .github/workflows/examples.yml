name: Examples smoke test

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: examples-smoke-test-main
  cancel-in-progress: true

jobs:
  examples:
    name: Examples / live API smoke test
    if: >-
      github.repository == 'openai/openai-java' &&
      github.event.head_commit.message != 'codegen metadata'
    environment: CI
    runs-on: ${{ vars.SDK_GHA_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: |
            8
            21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-provider: basic

      - name: Run example
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: ./gradlew :openai-java-example:run
