name: Fast CI 08 / Maven visibility benchmark
'on':
  push:
    branches:
    - bench/fast-ci-08-maven-roi-20261026
    paths:
    - .github/workflows/fast-ci-08-benchmark.yml
    - .github/workflows/fast-ci-08-benchmark-probe.yml
permissions: {}
concurrency:
  group: fast-ci-08-maven-roi-benchmark
  cancel-in-progress: false
jobs:
