name: Create releases

on:
  schedule:
    - cron: '0 5 * * *' # every day at 5am UTC
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing GitHub release tag to publish, for example v4.47.0
        required: true
        type: string
      confirm_no_pending_deployment:
        description: I verified that Central Portal has no pending deployment for this version
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: create-releases
  cancel-in-progress: false

jobs:
  release:
    name: Release / create
    if: >-
      github.event_name != 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      github.repository == 'openai/openai-java'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: publish
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      release_tag: ${{ steps.release.outputs.tag_name }}
      release_sha: ${{ steps.release.outputs.sha }}

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Create release
        id: release
        uses: stainless-api/trigger-release-please@bb6677c5a04578eec1ccfd9e1913b5b78ed64c61 # v1.4.0
        with:
          repo: ${{ github.event.repository.full_name }}
          stainless-api-key: ${{ secrets.STAINLESS_API_KEY }}

  prepare:
    name: Release / validate source
    needs: release
    if: >-
      always() &&
      github.repository == 'openai/openai-java' &&
      (
        github.event_name == 'workflow_dispatch' ||
        (
          needs.release.result == 'success' &&
          needs.release.outputs.releases_created == 'true'
        )
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      source_sha: ${{ steps.verify.outputs.source_sha }}
      release_tag: ${{ steps.verify.outputs.release_tag }}
      version: ${{ steps.verify.outputs.version }}
      artifacts: ${{ steps.verify.outputs.artifacts }}
      already_published: ${{ steps.verify.outputs.already_published }}

    steps:
      - name: Resolve release identity
        id: identity
        env:
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_REF: ${{ github.ref }}
          MANUAL_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || '' }}
          MANUAL_CONFIRMATION: >-
            ${{ github.event_name == 'workflow_dispatch' && inputs.confirm_no_pending_deployment || false }}
          AUTOMATIC_TAG: ${{ needs.release.outputs.release_tag }}
          AUTOMATIC_SHA: ${{ needs.release.outputs.release_sha }}
        run: |
          set -euo pipefail

          if [[ "$WORKFLOW_REF" != "refs/heads/main" ]]; then
            echo "::error title=Invalid workflow ref::Run release publication from the main branch"
            exit 1
          fi

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            if [[ "$MANUAL_CONFIRMATION" != "true" ]]; then
              echo "::error title=Central Portal confirmation required::Check for an existing deployment before retrying an immutable release"
              exit 1
            fi
            release_tag="$MANUAL_TAG"
            expected_sha=""
          else
            release_tag="$AUTOMATIC_TAG"
            expected_sha="$AUTOMATIC_SHA"
          fi

          if [[ ! "$release_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error title=Invalid release tag::Expected a semantic version tag such as v4.47.0"
            exit 1
          fi
          if [[ -n "$expected_sha" && ! "$expected_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error title=Invalid release commit::Release automation returned an invalid commit SHA"
            exit 1
          fi

          {
            echo "tag_ref=refs/tags/$release_tag"
            echo "release_tag=$release_tag"
            echo "expected_sha=$expected_sha"
          } >> "$GITHUB_OUTPUT"

      - name: Check out release tooling
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
          ref: ${{ github.workflow_sha }}
          path: release-tooling

      - name: Check out release source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ steps.identity.outputs.tag_ref }}
          path: release-source

      - name: Verify release source
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.identity.outputs.release_tag }}
          EXPECTED_SHA: ${{ steps.identity.outputs.expected_sha }}
        run: >-
          bash release-tooling/.github/scripts/validate-release-source.sh
          release-source
          "$RELEASE_TAG"
          "$EXPECTED_SHA"

  runtime_compatibility:
    name: Release / runtime compatibility
    needs: prepare
    if: needs.prepare.outputs.already_published != 'true'
    uses: ./.github/workflows/runtime-compatibility.yml
    with:
      ref: ${{ needs.prepare.outputs.source_sha }}

  publish:
    name: Release / publish Maven Central
    needs:
      - prepare
      - runtime_compatibility
    if: >-
      always() &&
      needs.prepare.result == 'success' &&
      needs.prepare.outputs.already_published != 'true' &&
      needs.runtime_compatibility.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: publish

    steps:
      - name: Validate publishing credentials
        env:
          SONATYPE_USERNAME: ${{ secrets.OPENAI_SONATYPE_USERNAME }}
          SONATYPE_PASSWORD: ${{ secrets.OPENAI_SONATYPE_PASSWORD }}
          GPG_SIGNING_KEY: ${{ secrets.OPENAI_SONATYPE_GPG_SIGNING_KEY }}
          GPG_SIGNING_PASSWORD: ${{ secrets.OPENAI_SONATYPE_GPG_SIGNING_PASSWORD }}
        run: |
          set -euo pipefail

          missing=0
          for variable in \
            SONATYPE_USERNAME \
            SONATYPE_PASSWORD \
            GPG_SIGNING_KEY \
            GPG_SIGNING_PASSWORD
          do
            if [[ -z "${!variable}" ]]; then
              echo "::error title=Missing publishing credential::$variable is empty"
              missing=1
            fi
          done
          if [[ "$missing" -ne 0 ]]; then
            exit "$missing"
          fi

          printf '%s' "$GPG_SIGNING_KEY" |
            gpg --batch --passphrase-fd 3 --import 3<<< "$GPG_SIGNING_PASSWORD"
          secret_key_listing="$(gpg --batch --with-colons --list-secret-keys)"
          secret_key_count="$(
            awk -F : '$1 == "sec" { count++ } END { print count + 0 }' <<< "$secret_key_listing"
          )"
          if [[ "$secret_key_count" -ne 1 ]]; then
            echo "::error title=Invalid signing key::Expected exactly one primary secret key"
            exit 1
          fi
          fingerprint="$(
            awk -F : \
              '$1 == "sec" { primary = 1; next } primary && $1 == "fpr" { print $10; exit }' \
              <<< "$secret_key_listing"
          )"
          if [[ ! "$fingerprint" =~ ^([0-9A-Fa-f]{40}|[0-9A-Fa-f]{64})$ ]]; then
            echo "::error title=Invalid signing key::Could not determine the primary key fingerprint"
            exit 1
          fi
          echo "GPG_SIGNING_KEY_ID=0x${fingerprint: -8}" >> "$GITHUB_ENV"

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
          ref: ${{ needs.prepare.outputs.source_sha }}

      - name: Set up Java
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5
        with:
          distribution: temurin
          java-version: |
            8
            21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2

      - name: Compile the openai-java-core project
        run: ./gradlew :openai-java-core:compileJava :openai-java-core:compileTestJava -x test

      - name: Run the mock server
        run: ./scripts/mock --daemon

      - name: Set up GraalVM
        uses: graalvm/setup-graalvm@03e8abf916fd0e281b2efe7b2da3378bb0a1d085 # v1
        with:
          java-version: 21
          distribution: graalvm-community

      - name: Run GraalVM native-image agent tests
        run: >-
          ./gradlew :openai-java-core:test
          -x compileJava
          -x compileTestJava
          -x compileKotlin
          -x compileTestKotlin
          -PgraalvmAgent

      - name: Check generated GraalVM files
        run: |
          set -euo pipefail

          directory="openai-java-core/src/main/resources/META-INF/native-image"
          if [[ ! -d "$directory" || -z "$(ls -A "$directory")" ]]; then
            echo "No files found in $directory"
            exit 1
          fi

          echo "Files found in $directory:"
          ls -l "$directory"

      - name: Publish to Sonatype
        env:
          SONATYPE_USERNAME: ${{ secrets.OPENAI_SONATYPE_USERNAME }}
          SONATYPE_PASSWORD: ${{ secrets.OPENAI_SONATYPE_PASSWORD }}
          GPG_SIGNING_KEY: ${{ secrets.OPENAI_SONATYPE_GPG_SIGNING_KEY }}
          GPG_SIGNING_PASSWORD: ${{ secrets.OPENAI_SONATYPE_GPG_SIGNING_PASSWORD }}
        run: |-
          set -euo pipefail

          ./gradlew publishAndReleaseToMavenCentral \
            --stacktrace \
            -PmavenCentralUsername="$SONATYPE_USERNAME" \
            -PmavenCentralPassword="$SONATYPE_PASSWORD" \
            --no-configuration-cache

  verify_publication:
    name: Release / verify Maven Central
    needs:
      - prepare
      - publish
    if: >-
      always() &&
      needs.prepare.result == 'success' &&
      (
        needs.prepare.outputs.already_published == 'true' ||
        needs.publish.result == 'success'
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out release tooling
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
          ref: ${{ github.workflow_sha }}

      - name: Wait for public artifacts
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          ARTIFACTS: ${{ needs.prepare.outputs.artifacts }}
        run: >-
          bash .github/scripts/maven-central-release.sh
          wait
          "$VERSION"
          "$ARTIFACTS"
